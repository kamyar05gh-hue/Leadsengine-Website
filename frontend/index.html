        <!-- PRELOAD THE HERO PLATE. It is the LCP element.

             THE OLD NOTE HERE SAID NOT TO, on the grounds that
             `fetchpriority="high"` on the <img> "keeps the request early".
             Measured on the live site (390px, 4x CPU, 9Mbit): it does not,
             and it cannot. The <img> lives inside a React component, so it
             does not exist until the 239KB entry chunk has downloaded,
             parsed and rendered — the plate was not requested until 751ms and
             LCP landed at 1304ms. `fetchpriority` ranks a request once the
             element is discovered; it cannot make it discoverable sooner.
             Only a preload in the HTML can, because the preload scanner runs
             while the document is still being parsed.

             THE THREE EARLIER FAILURES WERE ALL THE SAME BUG — a preload that
             did not exactly mirror the <picture> below, so the phone matched
             two rules and fetched two plates:
               · a bare href to the 948px plate matches every viewport
               · imagesrcset/imagesizes re-runs density selection independently
                 of the <picture>, and the two disagreed
               · media-scoped hrefs whose conditions OVERLAPPED (a 680px rule
                 with no lower bound matches a 390px phone as well as the
                 480px rule)

             The conditions below are copied verbatim from the <picture> in
             HeroEngine.tsx and are mutually exclusive, so exactly one can
             ever match. VERIFIED on the wire at 390px, 800px and 1440px:
             one plate fetched at each, never two. If the <picture> changes,
             change these in the same commit. -->
        <link
            rel="preload"
            as="image"
            href="/images/engine-body-480.webp"
            type="image/webp"
            media="(max-width: 640px)"
            fetchpriority="high"
        />
        <link
            rel="preload"
            as="image"
            href="/images/engine-body-680.webp"
            type="image/webp"
            media="(min-width: 641px) and (max-width: 1023px)"
            fetchpriority="high"
        />
        <link
            rel="preload"
            as="image"
            href="/images/engine-body.webp"
            type="image/webp"
            media="(min-width: 1024px)"
            fetchpriority="high"
        />
        <!-- ICON ORDER MATTERS, AND THE RASTER FILES ARE NOT OPTIONAL.
             `favicon.ico` is listed FIRST and left un-typed so that legacy
             crawlers and older browsers, which stop at the first icon link
             they understand, land on a real raster image. Google Search will
             not use an SVG-only favicon — it wants a square icon whose side
             is a multiple of 48px at a stable URL, which is why favicon.ico
             carries a 48x48 frame and favicon-96.png exists. Without them
             the search result falls back to the generic globe.

             `apple-touch-icon` MUST be a PNG: iOS does not support SVG here
             at all, so pointing it at favicon.svg produced a blank tile.

             The SVG stays last for modern browsers, which prefer it and
             render it crisply at any size.

             All of these are generated from favicon.svg by
             `python scripts/generate-icons.py` — regenerate after changing
             the logo. -->
        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="manifest" href="/manifest.json" />
        <!-- The one face a German page actually needs, started with the
             stylesheet rather than after it. `crossorigin` is REQUIRED on a
             font preload even same-origin: fonts are fetched in CORS mode, and
             a preload without it is a second, separate request rather than a
             head start. -->
        <link
            rel="preload"
            as="font"
            type="font/woff2"
            href="/fonts/inter-latin.woff2"
            crossorigin
        />
