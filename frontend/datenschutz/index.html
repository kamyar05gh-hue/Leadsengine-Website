<!doctype html>
<html lang="de-CH">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="theme-color" content="#05070D" />
        <title>Datenschutzerklärung – Leads Engine</title>
        <meta name="description" content="Wie die Future Media GmbH Personendaten im Einklang mit dem revidierten Schweizer Datenschutzgesetz und der EU-DSGVO bearbeitet." />
        <link rel="canonical" href="https://leadsengine.ch/datenschutz/" />
        <meta name="robots" content="index, follow" />
        <!-- Language is a query param on this site, never a path prefix — see
             LanguageContext and the note in Footer.tsx. -->
        <link rel="alternate" hreflang="de-CH" href="https://leadsengine.ch/datenschutz/?lang=de" />
        <link rel="alternate" hreflang="en" href="https://leadsengine.ch/datenschutz/?lang=en" />
        <link rel="alternate" hreflang="x-default" href="https://leadsengine.ch/datenschutz/" />

        <meta property="og:site_name" content="Leads Engine" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://leadsengine.ch/datenschutz/" />
        <meta property="og:title" content="Datenschutzerklärung – Leads Engine" />
        <meta property="og:description" content="Wie die Future Media GmbH Personendaten im Einklang mit dem revidierten Schweizer Datenschutzgesetz und der EU-DSGVO bearbeitet." />
        <meta property="og:image" content="https://leadsengine.ch/og-image.jpg" />
        <meta name="twitter:card" content="summary_large_image" />

        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="manifest" href="/manifest.json" />
        <!-- The one face a German page actually needs, started with the
             stylesheet rather than after it. `crossorigin` is REQUIRED on a
             font preload even same-origin: fonts are fetched in CORS mode, and
             a preload without it is a second, separate request rather than a
             head start. -->
        <link
            rel="preload"
            as="font"
            type="font/woff2"
            href="/fonts/inter-latin.woff2"
            crossorigin
        />
        <!-- Activated from a real <script> at the foot of <body>: a CSP
             script-src with hashes does not cover inline event handlers, so
             the `onload` this used to carry was blocked and Inter never
             loaded. See frontend/index.html for the full note. -->
        <noscript>
        </noscript>
    </head>
    <body>
        <div id="root" data-doc="privacy"></div>
        <script type="module" src="/src/entries/legal.tsx"></script>
    </body>
</html>
